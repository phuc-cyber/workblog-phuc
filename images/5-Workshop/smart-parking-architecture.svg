<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
  <title id="title">Smart Parking services-only architecture</title>
  <desc id="desc">Next.js and FastAPI run locally and connect to AWS RDS, S3, Cognito, Lambda, Rekognition, and CloudWatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2f"/>
      <stop offset="1" stop-color="#123d67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffb547"/>
    </marker>
  </defs>
  <rect width="1400" height="840" rx="28" fill="url(#bg)"/>
  <text x="70" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="42" font-weight="700">SMART PARKING · SERVICES-ONLY</text>
  <text x="70" y="124" fill="#a9c7e8" font-family="Arial, sans-serif" font-size="22">Local application connected to managed AWS data and AI services</text>

  <rect x="70" y="190" width="430" height="560" rx="24" fill="#eef6ff" filter="url(#shadow)"/>
  <text x="110" y="245" fill="#15395b" font-family="Arial, sans-serif" font-size="28" font-weight="700">LOCAL / VPS</text>
  <rect x="110" y="290" width="350" height="130" rx="18" fill="#fff" stroke="#2f80ed" stroke-width="3"/>
  <text x="285" y="340" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="25" font-weight="700">Next.js Web</text>
  <text x="285" y="377" text-anchor="middle" fill="#4b6882" font-family="Arial, sans-serif" font-size="19">User + Admin workspaces</text>
  <rect x="110" y="480" width="350" height="170" rx="18" fill="#fff" stroke="#00a67e" stroke-width="3"/>
  <text x="285" y="535" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="25" font-weight="700">FastAPI</text>
  <text x="285" y="572" text-anchor="middle" fill="#4b6882" font-family="Arial, sans-serif" font-size="19">Booking · QR · Gate · Fees</text>
  <text x="285" y="605" text-anchor="middle" fill="#4b6882" font-family="Arial, sans-serif" font-size="19">Docker Compose · Port 8001</text>
  <path d="M285 420 L285 475" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="610" y="190" width="720" height="560" rx="24" fill="#f9fbfd" filter="url(#shadow)"/>
  <text x="650" y="245" fill="#15395b" font-family="Arial, sans-serif" font-size="28" font-weight="700">AWS · AP-SOUTHEAST-1</text>

  <rect x="650" y="290" width="285" height="130" rx="18" fill="#fff3df" stroke="#ff9900" stroke-width="3"/>
  <text x="792" y="340" text-anchor="middle" fill="#4a2b00" font-family="Arial, sans-serif" font-size="24" font-weight="700">RDS PostgreSQL</text>
  <text x="792" y="377" text-anchor="middle" fill="#70512c" font-family="Arial, sans-serif" font-size="18">Business system of record</text>

  <rect x="1005" y="290" width="285" height="130" rx="18" fill="#e9f7ef" stroke="#2eaa60" stroke-width="3"/>
  <text x="1147" y="340" text-anchor="middle" fill="#174c2c" font-family="Arial, sans-serif" font-size="24" font-weight="700">Amazon S3</text>
  <text x="1147" y="377" text-anchor="middle" fill="#3a684a" font-family="Arial, sans-serif" font-size="18">Gate + slot images</text>

  <rect x="650" y="480" width="285" height="130" rx="18" fill="#f3eefe" stroke="#8b5cf6" stroke-width="3"/>
  <text x="792" y="530" text-anchor="middle" fill="#3f2577" font-family="Arial, sans-serif" font-size="24" font-weight="700">Amazon Cognito</text>
  <text x="792" y="567" text-anchor="middle" fill="#655184" font-family="Arial, sans-serif" font-size="18">USER / ADMIN groups</text>

  <rect x="1005" y="480" width="285" height="130" rx="18" fill="#eaf4ff" stroke="#3578c8" stroke-width="3"/>
  <text x="1147" y="522" text-anchor="middle" fill="#193d68" font-family="Arial, sans-serif" font-size="24" font-weight="700">Lambda</text>
  <text x="1147" y="555" text-anchor="middle" fill="#3e6084" font-family="Arial, sans-serif" font-size="18">Rekognition DetectLabels</text>
  <text x="1147" y="583" text-anchor="middle" fill="#3e6084" font-family="Arial, sans-serif" font-size="18">Slot occupancy only</text>

  <rect x="827" y="650" width="285" height="70" rx="18" fill="#fff" stroke="#68778a" stroke-width="3"/>
  <text x="970" y="694" text-anchor="middle" fill="#26384b" font-family="Arial, sans-serif" font-size="22" font-weight="700">CloudWatch Logs</text>

  <path d="M500 560 C550 560 570 355 645 355" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M500 560 C560 560 690 685 820 685" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M935 355 L1000 355" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1147 420 L1147 475" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M500 320 C555 320 570 545 645 545" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
