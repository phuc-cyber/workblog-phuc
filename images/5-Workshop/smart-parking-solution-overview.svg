<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Smart Parking AWS system overview</title>
  <desc id="desc">AWS architecture diagram for the Smart Parking system showing users, CloudFront, S3, API Gateway, Lambda, RDS PostgreSQL, Cognito, Rekognition, monitoring, and infrastructure deployment.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#dce5ec" stroke-width="0.8"/>
      <path d="M9 0V18M0 9H18" fill="none" stroke="#edf2f5" stroke-width="0.55"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263746"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#147eba"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7b45d6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#24394a" flood-opacity=".15"/>
    </filter>
    <style>
      .font{font-family:Arial,Helvetica,sans-serif}.cloud-label{font-size:19px;font-weight:700;fill:#263746}.zone-label{font-size:16px;font-weight:700;fill:#47596a}.name{font-size:15px;font-weight:700;fill:#172b3a}.copy{font-size:12px;fill:#47596a}.tiny{font-size:11px;fill:#526675}.legend-title{font-size:15px;font-weight:700;fill:#172b3a}.legend-copy{font-size:11px;fill:#526675}.num{font-size:14px;font-weight:700;fill:#fff;text-anchor:middle}.line{fill:none;stroke:#263746;stroke-width:2.2;marker-end:url(#arrow)}.blue-line{fill:none;stroke:#147eba;stroke-width:2.4;marker-end:url(#arrowBlue)}.purple-line{fill:none;stroke:#7b45d6;stroke-width:2.2;marker-end:url(#arrowPurple)}.return-line{fill:none;stroke:#263746;stroke-width:1.8;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <rect x="18" y="18" width="1564" height="864" rx="18" fill="url(#grid)" stroke="#ccd7df" stroke-width="1.5"/>

  <!-- User outside AWS -->
  <g class="font">
    <image href="aws-icons/users.svg" x="54" y="288" width="94" height="94"/>
    <text x="101" y="402" class="name" text-anchor="middle">User / Admin</text>
    <text x="101" y="421" class="tiny" text-anchor="middle">Web browser</text>
  </g>

  <!-- AWS Cloud and region -->
  <rect x="190" y="62" width="1130" height="650" fill="rgba(255,255,255,.60)" stroke="#263746" stroke-width="2"/>
  <rect x="450" y="96" width="830" height="575" fill="rgba(255,255,255,.55)" stroke="#2eb8b2" stroke-width="1.7" stroke-dasharray="7 5"/>
  <g class="font">
    <image href="aws-icons/aws-cloud-group.svg" x="202" y="69" width="31" height="31"/>
    <text x="242" y="91" class="cloud-label">AWS Cloud</text>
    <image href="aws-icons/region-group.svg" x="456" y="101" width="25" height="25"/>
    <text x="490" y="120" class="zone-label">Region ap-southeast-1</text>
  </g>

  <!-- VPC -->
  <rect x="748" y="136" width="420" height="465" rx="8" fill="rgba(248,245,255,.72)" stroke="#7b45d6" stroke-width="1.8"/>
  <rect x="770" y="174" width="375" height="397" rx="10" fill="none" stroke="#9a6be4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g class="font">
    <image href="aws-icons/vpc-group.svg" x="753" y="140" width="25" height="25"/>
    <text x="788" y="159" class="zone-label">VPC</text>
    <text x="790" y="194" class="tiny">Private application and data subnets</text>
  </g>

  <!-- CloudFront -->
  <g filter="url(#shadow)" class="font">
    <rect x="244" y="196" width="170" height="118" rx="16" fill="#fff" stroke="#4d8ac9" stroke-width="2"/>
    <image href="aws-icons/cloudfront.svg" x="294" y="211" width="70" height="70"/>
    <text x="329" y="294" class="name" text-anchor="middle">Amazon CloudFront</text>
    <text x="329" y="309" class="tiny" text-anchor="middle">HTTPS entry point</text>
  </g>

  <!-- Frontend S3 -->
  <g filter="url(#shadow)" class="font">
    <rect x="244" y="395" width="170" height="122" rx="16" fill="#fff" stroke="#78a512" stroke-width="2"/>
    <image href="aws-icons/s3.svg" x="294" y="410" width="70" height="70"/>
    <text x="329" y="493" class="name" text-anchor="middle">S3 frontend bucket</text>
    <text x="329" y="508" class="tiny" text-anchor="middle">Next.js static assets</text>
  </g>

  <!-- API Gateway -->
  <g filter="url(#shadow)" class="font">
    <rect x="508" y="226" width="175" height="125" rx="16" fill="#fff" stroke="#d43c79" stroke-width="2"/>
    <image href="aws-icons/api-gateway.svg" x="558" y="240" width="74" height="74"/>
    <text x="595.5" y="326" class="name" text-anchor="middle">Amazon API Gateway</text>
    <text x="595.5" y="342" class="tiny" text-anchor="middle">REST API /api/*</text>
  </g>

  <!-- Image bucket -->
  <g filter="url(#shadow)" class="font">
    <rect x="508" y="441" width="175" height="125" rx="16" fill="#fff" stroke="#78a512" stroke-width="2"/>
    <image href="aws-icons/s3.svg" x="558" y="454" width="74" height="74"/>
    <text x="595.5" y="541" class="name" text-anchor="middle">Parking image bucket</text>
    <text x="595.5" y="557" class="tiny" text-anchor="middle">Gate and slot images</text>
  </g>

  <!-- FastAPI Lambda -->
  <g filter="url(#shadow)" class="font">
    <rect x="800" y="224" width="155" height="130" rx="16" fill="#fff" stroke="#f19a1a" stroke-width="2"/>
    <image href="aws-icons/lambda.svg" x="844" y="238" width="68" height="68"/>
    <text x="877.5" y="322" class="name" text-anchor="middle">FastAPI Lambda</text>
    <text x="877.5" y="339" class="tiny" text-anchor="middle">Booking · QR · Gate · Fees</text>
  </g>

  <!-- RDS -->
  <g filter="url(#shadow)" class="font">
    <rect x="968" y="419" width="170" height="132" rx="16" fill="#fff" stroke="#b535cf" stroke-width="2"/>
    <image href="aws-icons/rds.svg" x="1018" y="433" width="70" height="70"/>
    <text x="1053" y="519" class="name" text-anchor="middle">Amazon RDS</text>
    <text x="1053" y="536" class="tiny" text-anchor="middle">PostgreSQL system of record</text>
  </g>

  <!-- Cognito, regional managed service -->
  <g filter="url(#shadow)" class="font">
    <rect x="1190" y="182" width="105" height="122" rx="14" fill="#fff" stroke="#8b5bd6" stroke-width="2"/>
    <image href="aws-icons/cognito.svg" x="1212" y="194" width="62" height="62"/>
    <text x="1242.5" y="272" class="name" text-anchor="middle">Cognito</text>
    <text x="1242.5" y="289" class="tiny" text-anchor="middle">USER / ADMIN</text>
  </g>

  <!-- AI Lambda and Rekognition -->
  <g filter="url(#shadow)" class="font">
    <rect x="790" y="426" width="145" height="125" rx="16" fill="#fff" stroke="#f19a1a" stroke-width="2"/>
    <image href="aws-icons/lambda.svg" x="832" y="438" width="64" height="64"/>
    <text x="862.5" y="518" class="name" text-anchor="middle">AI Lambda</text>
    <text x="862.5" y="535" class="tiny" text-anchor="middle">Slot occupancy worker</text>

    <rect x="1190" y="420" width="105" height="128" rx="14" fill="#fff" stroke="#2879bd" stroke-width="2"/>
    <image href="aws-icons/rekognition.svg" x="1212" y="432" width="62" height="62"/>
    <text x="1242.5" y="511" class="name" text-anchor="middle">Rekognition</text>
    <text x="1242.5" y="528" class="tiny" text-anchor="middle">DetectLabels</text>
  </g>

  <!-- Request paths -->
  <path d="M148 334H232" class="blue-line"/>
  <circle cx="177" cy="334" r="15" fill="#087bb9"/><text x="177" y="339" class="font num">1</text>
  <path d="M329 314V383" class="line"/>
  <circle cx="355" cy="361" r="15" fill="#087bb9"/><text x="355" y="366" class="font num">2</text>
  <path d="M414 254H496" class="line"/>
  <circle cx="459" cy="234" r="15" fill="#087bb9"/><text x="459" y="239" class="font num">3</text>
  <path d="M683 289H788" class="line"/>
  <path d="M955 289H1178" class="purple-line"/>
  <path d="M877 354V406" class="line"/>
  <path d="M955 319C1035 335 1053 375 1053 407" class="line"/>
  <circle cx="1034" cy="383" r="15" fill="#087bb9"/><text x="1034" y="388" class="font num">4</text>
  <path d="M800 489H695" class="return-line"/>
  <path d="M683 503H778" class="line"/>
  <path d="M935 489H1178" class="blue-line"/>
  <path d="M1190 533C1150 585 1045 585 1045 563" class="return-line"/>
  <circle cx="1123" cy="489" r="15" fill="#7b45d6"/><text x="1123" y="494" class="font num">5</text>

  <!-- Operations row -->
  <rect x="250" y="744" width="1020" height="105" rx="20" fill="#fff" stroke="#b9c5ce" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="274" y="767" class="font zone-label">Operations · Security · Monitoring · Infrastructure</text>
  <g class="font">
    <image href="aws-icons/iam.svg" x="300" y="780" width="52" height="52"/>
    <text x="364" y="801" class="name">IAM roles</text><text x="364" y="819" class="tiny">Least-privilege access</text>
    <path d="M485 806H535" class="line"/>

    <image href="aws-icons/cdk.svg" x="550" y="780" width="52" height="52"/>
    <text x="614" y="801" class="name">AWS CDK</text><text x="614" y="819" class="tiny">CloudFormation deployment</text>
    <path d="M758 806H808" class="line"/>

    <image href="aws-icons/cloudwatch.svg" x="825" y="780" width="52" height="52"/>
    <text x="889" y="801" class="name">CloudWatch</text><text x="889" y="819" class="tiny">Logs and metrics</text>
    <path d="M1015 806H1065" class="line"/>

    <image href="aws-icons/cloudformation.svg" x="1080" y="780" width="52" height="52"/>
    <text x="1144" y="801" class="name">CloudFormation</text><text x="1144" y="819" class="tiny">Stack outputs and status</text>
  </g>

  <!-- Legend -->
  <rect x="1350" y="202" width="205" height="390" rx="24" fill="#fff" stroke="#ccd7df" stroke-width="1.5" filter="url(#shadow)"/>
  <g class="font">
    <text x="1375" y="238" class="legend-title">Request flow 1–5</text>
    <circle cx="1384" cy="279" r="15" fill="#087bb9"/><text x="1384" y="284" class="num">1</text>
    <text x="1410" y="276" class="legend-title">Open website</text><text x="1410" y="294" class="legend-copy">User/Admin → CloudFront</text>
    <circle cx="1384" cy="340" r="15" fill="#087bb9"/><text x="1384" y="345" class="num">2</text>
    <text x="1410" y="337" class="legend-title">Load frontend</text><text x="1410" y="355" class="legend-copy">CloudFront → S3 assets</text>
    <circle cx="1384" cy="401" r="15" fill="#087bb9"/><text x="1384" y="406" class="num">3</text>
    <text x="1410" y="398" class="legend-title">Call backend</text><text x="1410" y="416" class="legend-copy">/api → API Gateway</text>
    <circle cx="1384" cy="462" r="15" fill="#087bb9"/><text x="1384" y="467" class="num">4</text>
    <text x="1410" y="459" class="legend-title">Process data</text><text x="1410" y="477" class="legend-copy">FastAPI → RDS / S3</text>
    <circle cx="1384" cy="523" r="15" fill="#7b45d6"/><text x="1384" y="528" class="num">5</text>
    <text x="1410" y="520" class="legend-title">Analyze slots</text><text x="1410" y="538" class="legend-copy">Lambda → Rekognition</text>
    <text x="1375" y="570" class="legend-copy">No automatic plate OCR.</text>
  </g>
</svg>
