<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Smart Parking QR session flow on AWS</title>
  <desc id="desc">The user reserves a parking slot and uses the same QR code at check-in and checkout. Amazon S3 stores gate and parking images, AWS Lambda calls Amazon Rekognition for slot occupancy detection, Amazon RDS stores the booking, session, and fee, and Amazon CloudWatch records operational logs.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#e3e9ee" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#263746"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#147eba"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#263746" flood-opacity=".14"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill: #232f3e; }
      .service { font-size: 18px; font-weight: 700; }
      .detail { font-size: 14px; fill: #526578; }
      .flow { fill: none; stroke: #263746; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #147eba; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrowBlue); }
      .step { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .legend-title { font-size: 16px; font-weight: 700; }
      .legend-copy { font-size: 13px; fill: #526578; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>
  <rect x="18" y="18" width="1364" height="724" rx="20" fill="url(#grid)" stroke="#d0d7de" stroke-width="2"/>

  <rect x="18" y="18" width="1364" height="105" rx="20" fill="#163f60"/>
  <rect x="18" y="93" width="1364" height="30" fill="#163f60"/>
  <text x="58" y="67" font-family="Arial, Helvetica, sans-serif" fill="#ffffff" font-size="32" font-weight="700">SMART PARKING · QR SESSION FLOW</text>
  <text x="58" y="98" font-family="Arial, Helvetica, sans-serif" fill="#c7ddf1" font-size="17">Booking, gate verification, slot occupancy analysis, checkout, and fee recording</text>
  <rect x="1178" y="49" width="160" height="42" rx="21" fill="#eef6fc"/>
  <text x="1258" y="76" class="font" text-anchor="middle" font-size="15" font-weight="700">ap-southeast-1</text>

  <!-- User and gate outside the AWS boundary -->
  <g filter="url(#shadow)">
    <rect x="48" y="205" width="215" height="255" rx="18" fill="#ffffff" stroke="#263746" stroke-width="2"/>
  </g>
  <image href="aws-icons/users.svg" x="108" y="238" width="94" height="94"/>
  <text x="155" y="358" class="font service" text-anchor="middle">User / Admin</text>
  <text x="155" y="384" class="font detail" text-anchor="middle">Reserve a parking slot</text>
  <text x="155" y="406" class="font detail" text-anchor="middle">Same QR at both gates</text>
  <rect x="86" y="425" width="138" height="34" rx="17" fill="#e7f3fb" stroke="#147eba"/>
  <text x="155" y="447" class="font" text-anchor="middle" font-size="14" font-weight="700">MANUAL PLATE</text>

  <!-- AWS boundary -->
  <rect x="315" y="154" width="1020" height="470" rx="18" fill="#ffffff" fill-opacity=".78" stroke="#232f3e" stroke-width="2"/>
  <image href="aws-icons/aws-cloud-group.svg" x="340" y="172" width="34" height="34"/>
  <text x="384" y="196" class="font" font-size="20" font-weight="700">AWS Cloud</text>
  <rect x="330" y="216" width="990" height="390" rx="14" fill="none" stroke="#4fb3bf" stroke-width="2" stroke-dasharray="8 6"/>
  <image href="aws-icons/region-group.svg" x="350" y="231" width="27" height="27"/>
  <text x="388" y="251" class="font" font-size="16" font-weight="700">Region · ap-southeast-1</text>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="375" y="290" width="190" height="185" rx="16" fill="#ffffff" stroke="#7aa116" stroke-width="2"/>
  </g>
  <image href="aws-icons/s3.svg" x="430" y="312" width="80" height="80"/>
  <text x="470" y="418" class="font service" text-anchor="middle">Amazon S3</text>
  <text x="470" y="443" class="font detail" text-anchor="middle">Gate + slot images</text>
  <text x="470" y="464" class="font detail" text-anchor="middle">Entry and exit evidence</text>

  <!-- Lambda -->
  <g filter="url(#shadow)">
    <rect x="610" y="290" width="190" height="185" rx="16" fill="#ffffff" stroke="#ed7100" stroke-width="2"/>
  </g>
  <image href="aws-icons/lambda.svg" x="665" y="312" width="80" height="80"/>
  <text x="705" y="418" class="font service" text-anchor="middle">AWS Lambda</text>
  <text x="705" y="443" class="font detail" text-anchor="middle">AI worker</text>
  <text x="705" y="464" class="font detail" text-anchor="middle">Invokes DetectLabels</text>

  <!-- Rekognition -->
  <g filter="url(#shadow)">
    <rect x="845" y="290" width="190" height="185" rx="16" fill="#ffffff" stroke="#8c4fff" stroke-width="2"/>
  </g>
  <image href="aws-icons/rekognition.svg" x="900" y="312" width="80" height="80"/>
  <text x="940" y="418" class="font service" text-anchor="middle">Rekognition</text>
  <text x="940" y="443" class="font detail" text-anchor="middle">Occupied / Empty only</text>
  <text x="940" y="464" class="font detail" text-anchor="middle">No license-plate OCR</text>

  <!-- RDS -->
  <g filter="url(#shadow)">
    <rect x="1080" y="290" width="190" height="185" rx="16" fill="#ffffff" stroke="#c925d1" stroke-width="2"/>
  </g>
  <image href="aws-icons/rds.svg" x="1135" y="312" width="80" height="80"/>
  <text x="1175" y="418" class="font service" text-anchor="middle">Amazon RDS</text>
  <text x="1175" y="443" class="font detail" text-anchor="middle">Booking · session · fee</text>
  <text x="1175" y="464" class="font detail" text-anchor="middle">ACTIVE to CLOSED</text>

  <!-- Main processing flow -->
  <path d="M263 280C490 260 950 260 1175 280" class="flow"/>
  <path d="M263 330H365" class="flow"/>
  <path d="M565 382H600" class="flow"/>
  <path d="M800 382H835" class="flow"/>
  <path d="M1035 382H1070" class="flow"/>
  <path d="M1175 485C1175 565 1050 573 980 573H270C210 573 190 520 190 470" class="return"/>

  <!-- Numbered workflow markers -->
  <circle cx="705" cy="263" r="17" fill="#147eba"/><text x="705" y="268" class="font step" text-anchor="middle">1</text>
  <circle cx="292" cy="330" r="17" fill="#147eba"/><text x="292" y="335" class="font step" text-anchor="middle">2</text>
  <circle cx="585" cy="382" r="17" fill="#147eba"/><text x="585" y="387" class="font step" text-anchor="middle">3</text>
  <circle cx="1055" cy="382" r="17" fill="#147eba"/><text x="1055" y="387" class="font step" text-anchor="middle">4</text>
  <circle cx="742" cy="573" r="17" fill="#8c4fff"/><text x="742" y="578" class="font step" text-anchor="middle">5</text>

  <!-- CloudWatch records the operational trail -->
  <image href="aws-icons/cloudwatch.svg" x="592" y="505" width="60" height="60"/>
  <text x="662" y="530" class="font" font-size="16" font-weight="700">Amazon CloudWatch</text>
  <text x="662" y="552" class="font detail">Gate, Lambda, and API logs</text>
  <path d="M705 475V498" class="flow"/>

  <!-- Concise workflow legend -->
  <rect x="48" y="652" width="1287" height="68" rx="14" fill="#ffffff" stroke="#b7c2cc" stroke-width="1.5"/>
  <circle cx="82" cy="686" r="14" fill="#147eba"/><text x="82" y="691" class="font step" text-anchor="middle">1</text>
  <text x="105" y="681" class="font legend-title">Reserve + QR</text><text x="105" y="701" class="font legend-copy">RDS creates the booking</text>
  <circle cx="330" cy="686" r="14" fill="#147eba"/><text x="330" y="691" class="font step" text-anchor="middle">2</text>
  <text x="353" y="681" class="font legend-title">Gate check-in</text><text x="353" y="701" class="font legend-copy">S3 stores entry evidence</text>
  <circle cx="585" cy="686" r="14" fill="#147eba"/><text x="585" y="691" class="font step" text-anchor="middle">3</text>
  <text x="608" y="681" class="font legend-title">Slot AI</text><text x="608" y="701" class="font legend-copy">Lambda + Rekognition</text>
  <circle cx="810" cy="686" r="14" fill="#147eba"/><text x="810" y="691" class="font step" text-anchor="middle">4</text>
  <text x="833" y="681" class="font legend-title">Update session</text><text x="833" y="701" class="font legend-copy">RDS keeps business state</text>
  <circle cx="1080" cy="686" r="14" fill="#8c4fff"/><text x="1080" y="691" class="font step" text-anchor="middle">5</text>
  <text x="1103" y="681" class="font legend-title">Same QR checkout</text><text x="1103" y="701" class="font legend-copy">Fee recorded; slot released</text>
</svg>
