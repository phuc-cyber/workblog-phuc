<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Parking QR and session workflow</title>
  <desc id="desc">A user reserves a slot, receives a pending QR, checks in, receives AI slot monitoring, and checks out with the same QR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#e5f0fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1f5f93"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#163a59" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#15395b" font-family="Arial, sans-serif" font-size="40" font-weight="700">BOOKING → GATE → SLOT AI → EXIT</text>
  <text x="70" y="118" fill="#52708b" font-family="Arial, sans-serif" font-size="21">The same opaque QR token follows the complete parking-session lifecycle</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="240" height="165" rx="22" fill="#fff" stroke="#2f80ed" stroke-width="3"/>
    <circle cx="115" cy="235" r="22" fill="#2f80ed"/>
    <text x="115" y="243" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">1</text>
    <text x="190" y="245" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="24" font-weight="700">RESERVE</text>
    <text x="190" y="286" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Select time + slot</text>
    <text x="190" y="315" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Simulated hold</text>

    <rect x="410" y="190" width="240" height="165" rx="22" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="455" cy="235" r="22" fill="#f59e0b"/>
    <text x="455" y="243" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">2</text>
    <text x="530" y="245" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="24" font-weight="700">PENDING QR</text>
    <text x="530" y="286" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">No plate is bound</text>
    <text x="530" y="315" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Slot = RESERVED</text>

    <rect x="750" y="190" width="240" height="165" rx="22" fill="#fff" stroke="#00a67e" stroke-width="3"/>
    <circle cx="795" cy="235" r="22" fill="#00a67e"/>
    <text x="795" y="243" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">3</text>
    <text x="870" y="245" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="24" font-weight="700">CHECK-IN</text>
    <text x="870" y="286" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Entry image + manual plate</text>
    <text x="870" y="315" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Session = ACTIVE</text>

    <rect x="1090" y="190" width="240" height="165" rx="22" fill="#fff" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="1135" cy="235" r="22" fill="#8b5cf6"/>
    <text x="1135" y="243" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">4</text>
    <text x="1210" y="245" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="24" font-weight="700">SLOT AI</text>
    <text x="1210" y="286" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">S3 + Lambda + Rekognition</text>
    <text x="1210" y="315" text-anchor="middle" fill="#526b80" font-family="Arial, sans-serif" font-size="17">Occupied / Empty</text>
  </g>

  <path d="M310 272 L400 272" stroke="#1f5f93" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M650 272 L740 272" stroke="#1f5f93" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M990 272 L1080 272" stroke="#1f5f93" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="410" y="460" width="580" height="165" rx="24" fill="#15395b" filter="url(#shadow)"/>
  <circle cx="465" cy="515" r="25" fill="#ffb547"/>
  <text x="465" y="524" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="23" font-weight="700">5</text>
  <text x="700" y="518" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="700">CHECK-OUT WITH THE SAME QR</text>
  <text x="700" y="560" text-anchor="middle" fill="#c7ddf1" font-family="Arial, sans-serif" font-size="19">New exit image + normalized manual plate comparison</text>
  <text x="700" y="593" text-anchor="middle" fill="#c7ddf1" font-family="Arial, sans-serif" font-size="19">Fee summary · CLOSED session · Slot AVAILABLE</text>
  <path d="M1210 355 C1210 425 1040 542 1000 542" fill="none" stroke="#1f5f93" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
