<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Smart Parking CDK deployment modes</title>
  <desc id="desc">Database-only and services-only CloudFormation stacks support the application running locally.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a2e"/>
      <stop offset="1" stop-color="#16456f"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffb547"/>
    </marker>
  </defs>
  <rect width="1400" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="82" fill="#fff" font-family="Arial, sans-serif" font-size="40" font-weight="700">AWS CDK DEPLOYMENT</text>
  <text x="70" y="123" fill="#a9c7e8" font-family="Arial, sans-serif" font-size="21">Two retained CloudFormation stacks support the current workshop environment</text>

  <rect x="70" y="200" width="310" height="390" rx="24" fill="#fff"/>
  <text x="225" y="255" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="27" font-weight="700">CDK SOURCE</text>
  <text x="225" y="300" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="19">infra/app.py</text>
  <text x="225" y="337" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="19">synth → diff → deploy</text>
  <rect x="112" y="395" width="226" height="78" rx="14" fill="#eaf4ff" stroke="#3578c8" stroke-width="2"/>
  <text x="225" y="443" text-anchor="middle" fill="#193d68" font-family="Arial, sans-serif" font-size="20" font-weight="700">CloudFormation</text>
  <rect x="112" y="495" width="226" height="58" rx="14" fill="#fff3df" stroke="#ff9900" stroke-width="2"/>
  <text x="225" y="532" text-anchor="middle" fill="#4a2b00" font-family="Arial, sans-serif" font-size="18" font-weight="700">ap-southeast-1</text>

  <rect x="520" y="170" width="380" height="210" rx="24" fill="#fff3df" stroke="#ff9900" stroke-width="4"/>
  <text x="710" y="226" text-anchor="middle" fill="#4a2b00" font-family="Arial, sans-serif" font-size="27" font-weight="700">DATABASE-ONLY</text>
  <text x="710" y="270" text-anchor="middle" fill="#70512c" font-family="Arial, sans-serif" font-size="19">RDS PostgreSQL · Security Group</text>
  <text x="710" y="307" text-anchor="middle" fill="#70512c" font-family="Arial, sans-serif" font-size="19">Secrets Manager · PostgreSQL logs</text>
  <text x="710" y="344" text-anchor="middle" fill="#70512c" font-family="Arial, sans-serif" font-size="17">Restricted client CIDR /32</text>

  <rect x="520" y="430" width="380" height="210" rx="24" fill="#e9f7ef" stroke="#2eaa60" stroke-width="4"/>
  <text x="710" y="486" text-anchor="middle" fill="#174c2c" font-family="Arial, sans-serif" font-size="27" font-weight="700">SERVICES-ONLY</text>
  <text x="710" y="530" text-anchor="middle" fill="#3a684a" font-family="Arial, sans-serif" font-size="19">S3 · Cognito · AI Lambda</text>
  <text x="710" y="567" text-anchor="middle" fill="#3a684a" font-family="Arial, sans-serif" font-size="19">IAM runtime policy · CloudWatch</text>
  <text x="710" y="604" text-anchor="middle" fill="#3a684a" font-family="Arial, sans-serif" font-size="17">Application consumes these services</text>

  <rect x="1040" y="255" width="290" height="300" rx="24" fill="#eef6ff"/>
  <text x="1185" y="315" text-anchor="middle" fill="#15395b" font-family="Arial, sans-serif" font-size="27" font-weight="700">LOCAL APP</text>
  <text x="1185" y="365" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="20">Next.js :3000</text>
  <text x="1185" y="405" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="20">FastAPI :8001</text>
  <text x="1185" y="455" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="18">Docker + AWS CLI profile</text>
  <text x="1185" y="495" text-anchor="middle" fill="#52708b" font-family="Arial, sans-serif" font-size="18">No API Gateway / CloudFront</text>

  <path d="M380 330 C440 330 450 275 510 275" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M380 455 C440 455 450 535 510 535" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M900 275 C960 275 970 355 1030 355" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M900 535 C960 535 970 455 1030 455" fill="none" stroke="#ffb547" stroke-width="5" marker-end="url(#arrow)"/>
</svg>
